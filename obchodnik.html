<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Obchodník — zadat platbu</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0b0b0f; color: #fff; padding: 24px;
  }
  .card { max-width: 380px; width: 100%; text-align: center; }
  h1 { font-size: 1.2rem; font-weight: 600; color: #9a9aa5; margin-bottom: 24px; }
  input {
    width: 100%; font-size: 2rem; text-align: center; padding: 16px;
    border-radius: 12px; border: 2px solid #2a2a33; background: #16161c;
    color: #fff; outline: none;
  }
  input:focus { border-color: #f7931a; }
  .unit { color: #9a9aa5; margin-top: 6px; font-size: 0.9rem; }
  button {
    width: 100%; margin-top: 20px; padding: 16px; font-size: 1.1rem; font-weight: 700;
    border: none; border-radius: 12px; background: #f7931a; color: #0b0b0f; cursor: pointer;
  }
  button:disabled { background: #555; color: #999; cursor: not-allowed; }
  .status { margin-top: 16px; font-size: 0.95rem; min-height: 1.4em; }
  .status.ok { color: #4caf50; }
  .status.err { color: #ff5c5c; }
  .status.info { color: #9a9aa5; }
</style>
</head>
<body>
<div class="card">
  <h1>Zadej částku k platbě</h1>
  <input type="number" id="amount" placeholder="0" inputmode="decimal" min="1">
  <div class="unit">Kč</div>
  <button id="sendBtn">Odeslat na platební stránku</button>
  <div class="status info" id="status"></div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
  import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-database.js";

   // For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyAhJzNceVceeaX9IQcJQcKKMObIMYzrIac",
  authDomain: "lightning-terminal-test.firebaseapp.com",
  databaseURL: "https://lightning-terminal-test-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "lightning-terminal-test",
  storageBucket: "lightning-terminal-test.firebasestorage.app",
  messagingSenderId: "117608694443",
  appId: "1:117608694443:web:54d395472aba9cae3dedee",
  measurementId: "G-WGKZJBNLNF"
};
  };
  // ----------------------

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  const amountInput = document.getElementById('amount');
  const sendBtn = document.getElementById('sendBtn');
  const statusEl = document.getElementById('status');

  function setStatus(text, type) {
    statusEl.textContent = text;
    statusEl.className = 'status ' + (type || 'info');
  }

  sendBtn.addEventListener('click', async () => {
    const amount = parseFloat(amountInput.value);
    if (!amount || amount <= 0) {
      setStatus('Zadej platnou částku.', 'err');
      return;
    }

    sendBtn.disabled = true;
    setStatus('Odesílám…', 'info');

    try {
      await set(ref(db, 'currentPayment'), {
        amount: amount,
        timestamp: Date.now(),
        paid: false
      });
      setStatus(`Hotovo — zákazník teď na tagu uvidí ${amount} Kč.`, 'ok');
      amountInput.value = '';
    } catch (err) {
      setStatus('Chyba: ' + err.message, 'err');
    } finally {
      sendBtn.disabled = false;
    }
  });
</script>
</body>
</html>
